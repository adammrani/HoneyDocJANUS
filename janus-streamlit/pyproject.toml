[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-evidence-hub"
version = "0.2.0"
description = "Honey-documents, collecte brute et timeline de preuves en Python"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "requests>=2.32,<3",
  "streamlit>=1.39,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.setuptools.packages.find]
include = ["janus*"]
